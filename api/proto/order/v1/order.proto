syntax = "proto3";

package order.v1;
option go_package = "github.com/myavarih/sre-hands-on/services/gen/go/order/v1;orderv1";

service OrderService {
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListUserOrders(ListUserOrdersRequest) returns (ListUserOrdersResponse);
}

message ProductItem {
  string id = 1;
  string name = 2;
  string description = 3;
  int64 price_cents = 4;
  int32 stock_quantity = 5;
}

message ListProductsRequest {}

message ListProductsResponse {
  repeated ProductItem products = 1;
}

message GetProductRequest {
  string product_id = 1;
}

message GetProductResponse {
  ProductItem product = 1;
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  int64 price_cents = 3;
  int32 initial_stock = 4;
}

message CreateProductResponse {
  ProductItem product = 1;
}

message OrderItemInput {
  string product_id = 1;
  int32 quantity = 2;
}

message CreateOrderRequest {
  string user_id = 1;
  repeated OrderItemInput items = 2;
  string payment_method = 3;
}

message OrderItemDetail {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  int64 unit_price_cents = 4;
}

message CreateOrderResponse {
  string order_id = 1;
  string user_id = 2;
  int64 total_price_cents = 3;
  string status = 4;
  string transaction_id = 5;
  string created_at = 6;
  repeated OrderItemDetail items = 7;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  string order_id = 1;
  string user_id = 2;
  int64 total_price_cents = 3;
  string status = 4;
  string transaction_id = 5;
  string created_at = 6;
  repeated OrderItemDetail items = 7;
}

message ListUserOrdersRequest {
  string user_id = 1;
}

message ListUserOrdersResponse {
  repeated GetOrderResponse orders = 1;
}
