apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cnpg-operator
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sre-hands-on
    app.kubernetes.io/component: platform-operator
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.20.2
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
