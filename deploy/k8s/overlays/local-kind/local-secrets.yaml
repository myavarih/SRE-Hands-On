# ==============================================================================
# SRE Hands-On: Local Kind Secrets
# ==============================================================================
# In local development (Kind cluster), these native Kubernetes Secrets are
# provisioned directly without requiring connection to a remote Cloud Secret Vault.

# 1. Microservices Application Secrets (sre-app)
apiVersion: v1
kind: Secret
metadata:
  name: sre-app-secrets
  namespace: sre-app
  labels:
    app.kubernetes.io/part-of: sre-hands-on
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  JWT_SECRET: "sre-super-secret-jwt-key-local-kind"
  DATABASE_DSN: "host=pg-cluster-rw.sre-data.svc.cluster.local user=app_user password=app_password dbname=app_db port=5432 sslmode=disable"
  DATABASE_RO_DSN: "host=pg-cluster-ro.sre-data.svc.cluster.local user=app_user password=app_password dbname=app_db port=5432 sslmode=disable"
---
# 2. CloudNativePG PostgreSQL Cluster Credentials (sre-data)
apiVersion: v1
kind: Secret
metadata:
  name: pg-cluster-app-user
  namespace: sre-data
  labels:
    app.kubernetes.io/part-of: sre-hands-on
    app.kubernetes.io/component: database
type: kubernetes.io/basic-auth
stringData:
  username: app_user
  password: app_password
---
# 3. Grafana Administrator Credentials (sre-monitoring)
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: sre-monitoring
  labels:
    app.kubernetes.io/part-of: sre-hands-on
    app.kubernetes.io/component: monitoring
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "prom-operator"
