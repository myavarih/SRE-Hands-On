# ==============================================================================
# SRE Hands-On: Production ClusterSecretStore (External Secrets Operator)
# ==============================================================================
# A ClusterSecretStore is a cluster-wide resource that provides secrets to
# ExternalSecret resources across all namespaces (sre-app, sre-data, sre-monitoring).
#
# Uncomment and configure the provider block corresponding to your cloud vault.

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: cluster-secret-store
  labels:
    app.kubernetes.io/part-of: sre-hands-on
    app.kubernetes.io/component: secrets
spec:
  provider:
    # --------------------------------------------------------------------------
    # Option 1: HashiCorp Vault
    # --------------------------------------------------------------------------
    # vault:
    #   server: "https://vault.internal.example.com:8200"
    #   path: "secret"
    #   version: "v2"
    #   auth:
    #     tokenSecretRef:
    #       name: vault-token
    #       namespace: external-secrets
    #       key: token

    # --------------------------------------------------------------------------
    # Option 2: AWS Secrets Manager (Using IRSA / IAM Roles for Service Accounts)
    # --------------------------------------------------------------------------
    # aws:
    #   service: SecretsManager
    #   region: us-east-1
    #   auth:
    #     jwt:
    #       serviceAccountRef:
    #         name: external-secrets-sa
    #         namespace: external-secrets

    # --------------------------------------------------------------------------
    # Option 3: Google Cloud Secret Manager (Using Workload Identity)
    # --------------------------------------------------------------------------
    # gcpsm:
    #   projectID: my-gcp-project-id
    #   auth:
    #     workloadIdentity:
    #       clusterLocation: us-central1
    #       clusterName: my-prod-cluster
    #       serviceAccountRef:
    #         name: external-secrets-sa
    #         namespace: external-secrets
