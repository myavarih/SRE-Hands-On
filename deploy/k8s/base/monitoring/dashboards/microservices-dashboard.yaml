apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-microservices-red
  namespace: sre-monitoring
  labels:
    grafana_dashboard: "1"
data:
  microservices-red.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "reqps" }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "Throughput (Request Rate / Sec)",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_requests_total[1m])) by (service_name, route)",
              "legendFormat": "{{service_name}} - {{route}}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "percentunit" }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "Error Ratio (5xx / Total)",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_requests_total{status=~\"5..\"}[1m])) by (service_name) / sum(rate(http_requests_total[1m])) by (service_name)",
              "legendFormat": "{{service_name}} 5xx ratio"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "s" }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "id": 3,
          "title": "Latency Percentiles (P50, P90, P99) with Exemplars",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[2m])) by (le, service_name))",
              "legendFormat": "{{service_name}} P99"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.90, sum(rate(http_request_duration_seconds_bucket[2m])) by (le, service_name))",
              "legendFormat": "{{service_name}} P90"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket[2m])) by (le, service_name))",
              "legendFormat": "{{service_name}} P50"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["sre", "microservices", "red"],
      "time": { "from": "now-15m", "to": "now" },
      "title": "SRE Lab: Microservices Golden Signals (RED)",
      "uid": "sre-microservices-red",
      "version": 1
    }
