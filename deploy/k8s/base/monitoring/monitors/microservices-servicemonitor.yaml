apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: microservices-monitor
  namespace: sre-monitoring
  labels:
    app.kubernetes.io/name: sre-microservices
    app.kubernetes.io/component: metrics
spec:
  namespaceSelector:
    matchNames:
      - sre-app
  selector:
    matchExpressions:
      - key: app.kubernetes.io/part-of
        operator: In
        values: ["sre-hands-on"]
      - key: app.kubernetes.io/component
        operator: In
        values: ["service", "gateway"]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
      scrapeTimeout: 5s
    - port: http
      path: /metrics
      interval: 10s
      scrapeTimeout: 5s
