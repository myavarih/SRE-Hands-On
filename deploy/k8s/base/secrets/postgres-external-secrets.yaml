apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pg-cluster-app-user-external-secret
  namespace: sre-data
  labels:
    app.kubernetes.io/part-of: sre-hands-on
    app.kubernetes.io/component: database-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: pg-cluster-app-user
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/part-of: sre-hands-on
          app.kubernetes.io/component: database
  data:
    - secretKey: username
      remoteRef:
        key: sre-lab/database
        property: POSTGRES_USER
    - secretKey: password
      remoteRef:
        key: sre-lab/database
        property: POSTGRES_PASSWORD
