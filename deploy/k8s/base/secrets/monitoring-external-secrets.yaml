apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-external-secret
  namespace: sre-monitoring
  labels:
    app.kubernetes.io/part-of: sre-hands-on
    app.kubernetes.io/component: monitoring-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: sre-lab/monitoring
        property: GRAFANA_ADMIN_USER
    - secretKey: admin-password
      remoteRef:
        key: sre-lab/monitoring
        property: GRAFANA_ADMIN_PASSWORD
