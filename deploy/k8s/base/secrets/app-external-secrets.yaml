apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sre-app-external-secrets
  namespace: sre-app
  labels:
    app.kubernetes.io/part-of: sre-hands-on
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: sre-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: sre-lab/app
        property: JWT_SECRET
    - secretKey: DATABASE_DSN
      remoteRef:
        key: sre-lab/app
        property: DATABASE_DSN
