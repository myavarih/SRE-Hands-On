apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: sre-logging
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/component: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/component: logging
    spec:
      containers:
        - name: kibana
          image: docker.io/kibana:8.14.3
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch.sre-logging.svc.cluster.local:9200"
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_NAME
              value: "kibana"
          ports:
            - name: http
              containerPort: 5601
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: 5601
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 5601
            periodSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 5601
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: sre-logging
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/component: logging
spec:
  selector:
    app.kubernetes.io/name: kibana
  ports:
    - name: http
      port: 5601
      targetPort: 5601
