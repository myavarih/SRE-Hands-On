apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-cluster
  namespace: sre-data
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
spec:
  # 2 instances: 1 Primary (read-write) + 1 Standby Replica (read-only)
  instances: 2

  # Synchronous Replication (RPO = 0 Guarantee):
  # minSyncReplicas: 1 requires WAL logs to be committed to disk on the primary AND confirmed
  # by the standby before acknowledging COMMIT to the Go application.
  # See docs/learning/03-DATA-LAYER-CNPG.md for replication and CAP trade-offs.
  minSyncReplicas: 1
  maxSyncReplicas: 1

  # High availability failover: 0s delay immediately promotes standby upon primary node crash
  failoverDelay: 0

  # Bootstrap defines initial schema & database owner credentials
  bootstrap:
    initdb:
      database: app_db
      owner: app_user
      secret:
        name: pg-cluster-app-user

  # Persistent Volume Claims (PVC) provisioned per PostgreSQL pod instance
  storage:
    size: 1Gi
    storageClass: standard

  # Pod Anti-Affinity guarantees primary and standby are scheduled onto separate physical nodes
  # (sre-lab-worker and sre-lab-worker2), ensuring zero-downtime when a single node dies.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  monitoring:
    enablePodMonitor: true
