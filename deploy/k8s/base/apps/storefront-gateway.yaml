apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-gateway
  namespace: sre-app
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: storefront-gateway
    app.kubernetes.io/part-of: sre-hands-on
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront-gateway
        app.kubernetes.io/part-of: sre-hands-on
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: storefront-gateway
          image: storefront-gateway:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: "storefront-gateway"
            - name: HTTP_PORT
              value: "8080"
            - name: METRICS_PORT
              value: "8080"
            - name: AUTH_SERVICE_ADDR
              value: "auth-service.sre-app.svc.cluster.local:50051"
            - name: ORDER_SERVICE_ADDR
              value: "order-service.sre-app.svc.cluster.local:50052"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sre-app-secrets
                  key: JWT_SECRET
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: common-app-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-gateway
  namespace: sre-app
  labels:
    app.kubernetes.io/name: storefront-gateway
    app.kubernetes.io/part-of: sre-hands-on
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: storefront-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
