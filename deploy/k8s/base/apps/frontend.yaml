apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sre-app
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: sre-hands-on
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: sre-hands-on
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sre-app
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: sre-hands-on
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
