apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: sre-app
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: sre-hands-on
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: sre-hands-on
        app.kubernetes.io/component: service
    spec:
      containers:
        - name: order-service
          image: order-service:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: "order-service"
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: sre-app-secrets
                  key: DATABASE_DSN
            - name: DATABASE_RO_DSN
              valueFrom:
                secretKeyRef:
                  name: sre-app-secrets
                  key: DATABASE_RO_DSN
            - name: GRPC_PORT
              value: "50052"
            - name: METRICS_PORT
              value: "9090"
            - name: PAYMENT_SERVICE_ADDR
              value: "payment-service.sre-app.svc.cluster.local:50053"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: common-app-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          ports:
            - name: grpc
              containerPort: 50052
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: sre-app
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: sre-hands-on
    app.kubernetes.io/component: service
spec:
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
    - name: metrics
      port: 9090
      targetPort: 9090
