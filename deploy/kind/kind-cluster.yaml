# ==============================================================================
# SRE Hands-On Lab: 3-Node Kind Cluster Topology
# ==============================================================================
# WHY a 3-node cluster instead of single-node?
# Single-node clusters cannot reproduce production failure domains: pod anti-affinity,
# zone-aware scheduling, node draining, network partitions, and HA database failovers.
# See docs/learning/01-BIG-PICTURE.md and 02-KUBERNETES-FOUNDATIONS.md for details.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sre-lab
nodes:
  # Node 1: Control-plane + Ingress Gateway
  # hostPort 80/443 forwards host laptop traffic directly to the NGINX Ingress Controller.
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # Node 2: Worker 1 (Availability Zone A)
  # Hosts application workloads and CloudNativePG PostgreSQL Primary
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a

  # Node 3: Worker 2 (Availability Zone B)
  # Hosts application workloads, PostgreSQL Standby Replica, and Observability Stack
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
